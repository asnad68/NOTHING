apiVersion: batch/v1
kind: Job
metadata:
  name: nothing-db-migrate
  namespace: nothing
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: nothing-db-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/asnad68/nothing:CHANGE_ME
          command: ["python", "-m", "src.nothing_postgres"]
          env:
            - name: NOTHING_POSTGRES_AUTO_MIGRATE
              value: "true"
          envFrom:
            - secretRef:
                name: nothing-migrator-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
