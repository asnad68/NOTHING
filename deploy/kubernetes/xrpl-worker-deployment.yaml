apiVersion: apps/v1
kind: Deployment
metadata:
  name: nothing-xrpl-worker
  namespace: nothing
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nothing-xrpl-worker
  template:
    metadata:
      labels:
        app: nothing-xrpl-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/asnad68/nothing:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.nothing_xrpl_worker"]
          envFrom:
            - configMapRef:
                name: nothing-api-config
            - secretRef:
                name: nothing-payment-worker-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
