<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NOTHING public identity verification">
  <title>NOTHING Verify</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">NOTHING / VERIFY</p>
      <h1>Inspect the record. Follow the evidence.</h1>
      <p class="lead">
        Resolve a NOTHING identifier into its recorded claims, verification events,
        evidence references and exact procedure.
      </p>
      <form id="lookup-form" class="lookup" autocomplete="off">
        <label for="nothing-id">NOTHING ID</label>
        <div class="lookup-row">
          <input id="nothing-id" name="nothing-id" inputmode="text"
                 pattern="NTH-[0-9]{6}" maxlength="10"
                 placeholder="NTH-000001" required>
          <button type="submit">Verify</button>
        </div>
        <p id="lookup-error" class="error" role="alert" hidden></p>
      </form>
    </header>

    <section id="status" class="status" aria-live="polite">
      <div class="status-dot"></div>
      <div>
        <strong id="status-title">Ready</strong>
        <p id="status-detail">Enter a NOTHING identifier to inspect it.</p>
      </div>
    </section>

    <section id="record" class="record" hidden>
      <div class="record-head">
        <div>
          <p class="eyebrow">IDENTITY RECORD</p>
          <h2 id="record-id"></h2>
          <p id="record-subject"></p>
        </div>
        <span id="record-revocation" class="badge"></span>
      </div>

      <div class="grid">
        <section class="card">
          <h3>Claims</h3>
          <div id="claims"></div>
        </section>
        <section class="card">
          <h3>Verification</h3>
          <div id="verification"></div>
        </section>
      </div>

      <section class="card">
        <h3>Evidence &amp; Procedure</h3>
        <div id="evidence"></div>
      </section>

      <footer class="record-foot">
        <span id="meta"></span>
      </footer>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
