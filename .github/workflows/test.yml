name: NOTHING Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nothing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nothing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NOTHING_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/nothing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap database roles for integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql "$NOTHING_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE nothing_migrator NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql "$NOTHING_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE nothing_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
          psql "$NOTHING_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE nothing_payment LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;"
      - name: Run PostgreSQL integration tests
        run: python -m unittest tests.test_postgres -v


  container:
    runs-on: ubuntu-latest
    needs: [test, postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build production API image
        run: docker build --pull --file Dockerfile --tag nothing-api:ci .

      - name: Build production payment worker image
        run: docker build --pull --file Dockerfile.worker --tag nothing-payment-worker:ci .
